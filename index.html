<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16202B">
<title>もぐもぐカメラ</title>
<style>
  :root{
    --ink:#16202B;
    --ink-2:#22303F;
    --rice:#FFF6E6;
    --tamago:#FFC53D;
    --ume:#E5484D;
    --edamame:#79C24A;
    --sora:#4FA8E0;
    --radius:22px;
    --pad:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--ink);
    color:var(--rice);
    font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Yu Gothic","游ゴシック体",-apple-system,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
  }
  #stage{position:fixed;inset:0;display:grid;place-items:center;background:#0C141C}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0C141C}
  video.mirror{transform:scaleX(-1)}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #ring{
    position:absolute;width:34vmin;height:34vmin;margin:-17vmin 0 0 -17vmin;
    border:5px dashed rgba(255,197,61,.9);border-radius:50%;
    box-shadow:0 0 0 3px rgba(22,32,43,.35) inset, 0 0 24px rgba(255,197,61,.35);
    touch-action:none;cursor:grab;
  }
  #ring::after{
    content:"くちに あわせてね";
    position:absolute;left:50%;top:100%;transform:translate(-50%,8px);
    font-size:13px;white-space:nowrap;color:var(--tamago);
    text-shadow:0 2px 6px rgba(0,0,0,.8);
  }
  #ring.hide-label::after{content:""}

  /* ---- 弁当箱（シグネチャー要素） ---- */
  #bento{
    position:absolute;left:50%;bottom:calc(14px + var(--pad));transform:translateX(-50%);
    display:grid;grid-template-columns:repeat(6,1fr);gap:6px;
    padding:8px;border-radius:16px;
    background:linear-gradient(180deg,#2B1B14,#3A241B);
    border:3px solid #59392A;box-shadow:0 10px 24px rgba(0,0,0,.45);
    width:min(92vw,460px);
  }
  .cell{
    aspect-ratio:1/1;border-radius:10px;background:rgba(255,246,230,.10);
    display:grid;place-items:center;font-size:clamp(20px,6vw,30px);
    transition:transform .25s ease, background .25s ease;
  }
  .cell.filled{background:var(--rice);transform:scale(1)}
  .cell.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(.2) rotate(-18deg)}100%{transform:scale(1) rotate(0)}}

  #shout{
    position:absolute;left:50%;top:16%;transform:translate(-50%,0) scale(.6);
    font-size:clamp(34px,11vw,72px);font-weight:800;letter-spacing:.04em;
    color:var(--tamago);text-shadow:0 0 18px rgba(0,0,0,.6),0 6px 0 #C8892A;
    opacity:0;pointer-events:none;
  }
  #shout.show{animation:shout 1.1s ease-out}
  @keyframes shout{
    0%{opacity:0;transform:translate(-50%,20px) scale(.6)}
    18%{opacity:1;transform:translate(-50%,0) scale(1.08)}
    70%{opacity:1;transform:translate(-50%,0) scale(1)}
    100%{opacity:0;transform:translate(-50%,-24px) scale(1)}
  }

  /* ---- コントロール ---- */
  #topbar{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;gap:8px;align-items:center}
  .badge{
    background:rgba(22,32,43,.72);border:1px solid rgba(255,246,230,.18);
    padding:7px 12px;border-radius:999px;font-size:13px;backdrop-filter:blur(6px)
  }
  .spacer{flex:1}
  button{
    font:inherit;color:var(--rice);background:rgba(22,32,43,.72);
    border:1px solid rgba(255,246,230,.2);border-radius:999px;padding:10px 14px;
    backdrop-filter:blur(6px);cursor:pointer;
  }
  button:focus-visible{outline:3px solid var(--sora);outline-offset:2px}
  button.primary{background:var(--tamago);color:#2A1B06;border-color:#C8892A;font-weight:800}
  button.ghost{background:rgba(22,32,43,.55)}

  #panel{
    position:absolute;left:50%;bottom:calc(96px + var(--pad));transform:translateX(-50%);
    width:min(92vw,460px);background:rgba(22,32,43,.92);border:1px solid rgba(255,246,230,.16);
    border-radius:var(--radius);padding:14px 16px;display:none;gap:12px;flex-direction:column;
    box-shadow:0 12px 30px rgba(0,0,0,.5);
  }
  #panel.open{display:flex}
  .row{display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:14px}
  input[type=range]{flex:1;accent-color:var(--tamago)}
  .hint{font-size:12px;line-height:1.6;color:rgba(255,246,230,.72)}

  #start{
    position:absolute;inset:0;display:grid;place-items:center;text-align:center;
    background:radial-gradient(120% 90% at 50% 20%,#22303F,#0C141C);padding:24px;
  }
  #start h1{font-size:clamp(30px,9vw,52px);margin:0 0 6px;color:var(--tamago);letter-spacing:.06em}
  #start p{margin:0 0 22px;line-height:1.8;font-size:15px;color:rgba(255,246,230,.82)}
  #start .big{padding:16px 30px;font-size:18px}
  #err{margin-top:14px;color:var(--ume);font-size:13px;min-height:1em}
  .hidden{display:none !important}
  @media (prefers-reduced-motion: reduce){
    #shout.show{animation-duration:.6s}
    .cell.pop{animation:none}
  }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="fx"></canvas>
  <div id="ring" role="slider" aria-label="口の位置" tabindex="0"></div>
  <div id="shout"></div>

  <div id="topbar" class="hidden">
    <div class="badge" id="counter">ひとくち 0</div>
    <div class="spacer"></div>
    <button id="flipBtn" class="ghost" aria-label="カメラを切り替える">切替</button>
    <button id="gearBtn" class="ghost" aria-label="設定を開く">設定</button>
  </div>

  <div id="bento" class="hidden" aria-label="おべんとう"></div>

  <div id="panel">
    <div class="row"><label for="sens">はんのう しやすさ</label><input id="sens" type="range" min="1" max="10" value="5"></div>
    <div class="row"><label for="snd">おと</label><input id="snd" type="checkbox" checked></div>
    <div class="row"><label for="voice">ほめる こえ</label><input id="voice" type="checkbox" checked></div>
    <div class="row">
      <button id="manualBtn" class="primary">いま たべた！</button>
      <button id="resetBtn" class="ghost">さいしょから</button>
    </div>
    <p class="hint">わっかを ドラッグすると くちの いちを あわせられます。うまく はんのうしない ときは「はんのう しやすさ」を あげるか、「いま たべた！」を おうちのひとが タップしてください。</p>
  </div>

  <div id="start">
    <div>
      <h1>もぐもぐカメラ</h1>
      <p>カメラに うつった おくちが うごくと<br>おべんとうが ひとつずつ うまります。<br>ぜんぶ うまったら おいわいです。</p>
      <button id="startBtn" class="primary big">カメラを つける</button>
      <div id="err" role="status"></div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const video=$("video"), fx=$("fx"), ring=$("ring"), shout=$("shout");
  const bento=$("bento"), counter=$("counter"), errBox=$("err");
  const panel=$("panel"), sens=$("sens"), sndOn=$("snd"), voiceOn=$("voice");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const OKAZU=["🍙","🥚","🥦","🍅","🍤","🍓"];
  const PRAISE=["もぐもぐ！","すごい！","やったね！","じょうず！","いいね！","ナイス！"];
  const VOICE_LINES=["もぐもぐ、じょうず！","すごいね！","おいしそう！","もうひとくち いけるかな","ナイスもぐもぐ！"];

  let stream=null, facing="user", bites=0, running=false;
  let ringPos={x:.5,y:.55}, ringR=.17;      // 画面比率
  let lastTrigger=0, baseline=0, warm=0;
  let prevGray=null;

  /* ---------- 弁当箱 ---------- */
  const cells=[];
  for(let i=0;i<OKAZU.length;i++){
    const c=document.createElement("div");
    c.className="cell"; c.setAttribute("aria-label","マス"+(i+1));
    bento.appendChild(c); cells.push(c);
  }

  /* ---------- カメラ ---------- */
  async function startCamera(){
    errBox.textContent="";
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      errBox.textContent="このブラウザは カメラに対応していません。Safari または Chrome の最新版でひらいてください。";
      return;
    }
    try{
      if(stream) stream.getTracks().forEach(t=>t.stop());
      stream = await navigator.mediaDevices.getUserMedia({
        video:{facingMode:facing, width:{ideal:960}, height:{ideal:720}}, audio:false
      });
      video.srcObject=stream;
      video.classList.toggle("mirror", facing==="user");
      await video.play();
      $("start").classList.add("hidden");
      $("topbar").classList.remove("hidden");
      bento.classList.remove("hidden");
      running=true; prevGray=null; baseline=0; warm=0;
      resize(); loop();
    }catch(e){
      errBox.textContent = (e && e.name==="NotAllowedError")
        ? "カメラの きょかが 必要です。ブラウザの設定でカメラを「許可」にしてから もういちど おためしください。"
        : "カメラを ひらけませんでした（"+(e&&e.name||"不明")+"）。ほかのアプリがカメラを使っていないか ご確認ください。";
    }
  }

  /* ---------- 検知（フレーム差分） ---------- */
  const work=document.createElement("canvas"); work.width=96; work.height=72;
  const wctx=work.getContext("2d",{willReadFrequently:true});

  function detect(){
    if(!video.videoWidth) return;
    wctx.drawImage(video,0,0,work.width,work.height);
    const d=wctx.getImageData(0,0,work.width,work.height).data;
    const n=work.width*work.height;
    const gray=new Float32Array(n);
    for(let i=0;i<n;i++){
      const p=i*4;
      gray[i]=(d[p]*0.299+d[p+1]*0.587+d[p+2]*0.114);
    }
    if(!prevGray){ prevGray=gray; return; }

    // ROI（わっかの内側）だけを見る
    const cx=ringPos.x*work.width, cy=ringPos.y*work.height;
    const rr=ringR*Math.min(work.width,work.height)*1.6;
    let sum=0,count=0;
    const x0=Math.max(0,(cx-rr)|0), x1=Math.min(work.width,(cx+rr)|0);
    const y0=Math.max(0,(cy-rr)|0), y1=Math.min(work.height,(cy+rr)|0);
    for(let y=y0;y<y1;y++){
      for(let x=x0;x<x1;x++){
        const dx=x-cx, dy=y-cy;
        if(dx*dx+dy*dy>rr*rr) continue;
        const i=y*work.width+x;
        sum+=Math.abs(gray[i]-prevGray[i]); count++;
      }
    }
    prevGray=gray;
    if(!count) return;
    const mean=sum/count;

    if(warm<30){ warm++; baseline=baseline?baseline*0.9+mean*0.1:mean; return; }
    baseline=baseline*0.97+mean*0.03;           // ゆっくり順応（明るさ変化に強く）
    const score=mean-baseline;
    const threshold=14 - (+sens.value);          // 感度1→13, 10→4
    const now=performance.now();
    if(score>threshold && now-lastTrigger>2000){
      lastTrigger=now;
      onBite();
    }
  }

  /* ---------- ごほうび ---------- */
  function onBite(){
    bites++;
    counter.textContent="ひとくち "+bites;
    const idx=(bites-1)%OKAZU.length;
    const cell=cells[idx];
    cell.textContent=OKAZU[idx];
    cell.classList.add("filled","pop");
    setTimeout(()=>cell.classList.remove("pop"),520);

    shout.textContent=PRAISE[Math.floor(Math.random()*PRAISE.length)];
    shout.classList.remove("show"); void shout.offsetWidth; shout.classList.add("show");

    burst(ringPos.x*fx.width, ringPos.y*fx.height, reduceMotion?14:46);
    chime(idx);
    if(voiceOn.checked) speak(VOICE_LINES[Math.floor(Math.random()*VOICE_LINES.length)]);

    if(bites%OKAZU.length===0){
      setTimeout(()=>{
        shout.textContent="おべんとう かんせい！";
        shout.classList.remove("show"); void shout.offsetWidth; shout.classList.add("show");
        for(let i=0;i<(reduceMotion?2:8);i++){
          setTimeout(()=>burst(Math.random()*fx.width, fx.height*(0.2+Math.random()*0.5), 36), i*160);
        }
        fanfare();
        if(voiceOn.checked) speak("ぜんぶ たべられたね、すごい！");
        setTimeout(()=>cells.forEach(c=>{c.textContent="";c.classList.remove("filled")}),2400);
      },700);
    }
  }

  /* ---------- パーティクル ---------- */
  const ctx=fx.getContext("2d");
  let parts=[];
  const SHAPES=["⭐","✨","🎉","💫","🌈","🍀"];
  function burst(x,y,n){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, s=2+Math.random()*7;
      parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,life:1,
        ch:SHAPES[Math.floor(Math.random()*SHAPES.length)],
        size:16+Math.random()*26, rot:Math.random()*6});
    }
    if(parts.length>600) parts=parts.slice(-600);
  }
  function drawParts(){
    ctx.clearRect(0,0,fx.width,fx.height);
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i];
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.28; p.vx*=0.99; p.life-=0.014; p.rot+=0.08;
      if(p.life<=0){ parts.splice(i,1); continue; }
      ctx.save(); ctx.globalAlpha=Math.max(0,p.life);
      ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.font=p.size+"px serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(p.ch,0,0); ctx.restore();
    }
  }

  /* ---------- 音 ---------- */
  let ac=null;
  function audio(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } 
    if(ac && ac.state==="suspended") ac.resume(); return ac; }
  function tone(freq,start,dur,vol){
    const a=audio(); if(!a||!sndOn.checked) return;
    const o=a.createOscillator(), g=a.createGain();
    o.type="triangle"; o.frequency.value=freq;
    g.gain.setValueAtTime(0,a.currentTime+start);
    g.gain.linearRampToValueAtTime(vol,a.currentTime+start+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+start+dur);
    o.connect(g); g.connect(a.destination);
    o.start(a.currentTime+start); o.stop(a.currentTime+start+dur+0.05);
  }
  function chime(i){
    const scale=[523,587,659,784,880,1047];
    tone(scale[i%scale.length],0,0.28,0.18);
    tone(scale[i%scale.length]*2,0.06,0.22,0.08);
  }
  function fanfare(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*0.12,0.4,0.16)); }
  function speak(text){
    if(!("speechSynthesis" in window)) return;
    try{
      const u=new SpeechSynthesisUtterance(text);
      u.lang="ja-JP"; u.rate=1.05; u.pitch=1.3;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    }catch(e){}
  }

  /* ---------- ループ ---------- */
  let acc=0, last=0;
  function loop(t){
    if(!running) return;
    requestAnimationFrame(loop);
    drawParts();
    if(!last) last=t||0;
    acc += (t||0)-last; last=t||0;
    if(acc>90){ acc=0; detect(); }   // 約11回/秒で判定
  }

  /* ---------- わっかの移動 ---------- */
  function placeRing(){
    ring.style.left=(ringPos.x*100)+"%";
    ring.style.top=(ringPos.y*100)+"%";
  }
  let dragging=false;
  ring.addEventListener("pointerdown",e=>{dragging=true;ring.setPointerCapture(e.pointerId);ring.classList.add("hide-label")});
  ring.addEventListener("pointermove",e=>{
    if(!dragging) return;
    ringPos.x=Math.min(.95,Math.max(.05,e.clientX/window.innerWidth));
    ringPos.y=Math.min(.9,Math.max(.05,e.clientY/window.innerHeight));
    placeRing(); prevGray=null; warm=0;
  });
  ring.addEventListener("pointerup",()=>dragging=false);
  ring.addEventListener("keydown",e=>{
    const step=.02, map={ArrowLeft:[-step,0],ArrowRight:[step,0],ArrowUp:[0,-step],ArrowDown:[0,step]};
    if(map[e.key]){ ringPos.x+=map[e.key][0]; ringPos.y+=map[e.key][1]; placeRing(); e.preventDefault(); }
  });

  /* ---------- 画面サイズ ---------- */
  function resize(){
    fx.width=window.innerWidth;   // 座標は CSS ピクセルでそろえる
    fx.height=window.innerHeight;
    placeRing();
  }
  window.addEventListener("resize",resize);
  window.addEventListener("orientationchange",()=>setTimeout(resize,300));

  /* ---------- 操作 ---------- */
  $("startBtn").addEventListener("click",()=>{audio();startCamera()});
  $("flipBtn").addEventListener("click",()=>{facing = facing==="user"?"environment":"user"; startCamera()});
  $("gearBtn").addEventListener("click",()=>panel.classList.toggle("open"));
  $("manualBtn").addEventListener("click",()=>{lastTrigger=performance.now();onBite()});
  $("resetBtn").addEventListener("click",()=>{
    bites=0; counter.textContent="ひとくち 0";
    cells.forEach(c=>{c.textContent="";c.classList.remove("filled")});
    parts=[];
  });
  document.addEventListener("visibilitychange",()=>{ if(document.hidden){ prevGray=null; warm=0; } });

  placeRing();
  window.__mogu={onBite,burst,get bites(){return bites}}; // テスト用
})();
</script>
</body>
</html>
