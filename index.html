<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16202B">
<title>もぐもぐカメラ</title>
<link rel="stylesheet" href="./styles/base.css">
<link rel="stylesheet" href="./styles/themes.css">
</head>
<body>
<!--
  ここは骨組みだけ。中身は src/ 以下のモジュールが作る。
  #themeLayer は えんしゅつ（テーマ）が じゆうに つかってよい場所。
-->
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="fx"></canvas>
  <div id="ring" role="slider" aria-label="口の位置" tabindex="0"></div>
  <div id="themeLayer" aria-hidden="true"></div>
  <div id="flash"></div>
  <div id="shout" role="status" aria-live="polite"></div>

  <div id="topbar" class="hidden">
    <div class="badge" id="counter">ひとくち 0</div>
    <div class="spacer"></div>
    <button id="flipBtn" class="ghost" aria-label="カメラを切り替える">切替</button>
    <button id="gearBtn" class="ghost" aria-label="設定を開く">設定</button>
  </div>

  <button id="biteBtn" class="primary hidden" aria-label="いま たべた">たべた！</button>

  <div id="panel" aria-label="設定"></div>

  <div id="start">
    <div>
      <h1>もぐもぐカメラ</h1>
      <p id="startLead">カメラに うつった おくちが うごくと<br>すこしずつ すすみます。<br>ぜんぶ たべたら おいわいです。</p>
      <button id="startBtn" class="primary big">カメラを つける</button>
      <div id="err" role="status"></div>
    </div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
