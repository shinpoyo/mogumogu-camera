<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16202B">
<title>もぐもぐカメラ</title>
<style>
  :root{
    --ink:#16202B;
    --ink-2:#22303F;
    --rice:#FFF6E6;
    --tamago:#FFC53D;
    --ume:#E5484D;
    --edamame:#79C24A;
    --sora:#4FA8E0;
    --radius:22px;
    --pad:env(safe-area-inset-bottom, 0px);
    --ring-size:34vmin;          /* わっかの大きさ（JSから変更する） */
    --deck:118px;                /* 弁当箱の上端。JSが実測して更新する */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--ink);
    color:var(--rice);
    font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Yu Gothic","游ゴシック体",-apple-system,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
  }
  #stage{position:fixed;inset:0;display:grid;place-items:center;background:#0C141C}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0C141C}
  video.mirror{transform:scaleX(-1)}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #ring{
    position:absolute;
    width:var(--ring-size);height:var(--ring-size);
    margin:calc(var(--ring-size) / -2) 0 0 calc(var(--ring-size) / -2);
    border:5px dashed rgba(255,197,61,.9);border-radius:50%;
    box-shadow:0 0 0 3px rgba(22,32,43,.35) inset, 0 0 24px rgba(255,197,61,.35);
    touch-action:none;cursor:grab;transition:opacity .25s ease;
  }
  #ring::after{
    content:"くちに あわせてね（2ほんゆびで おおきさ）";
    position:absolute;left:50%;top:100%;transform:translate(-50%,8px);
    font-size:13px;white-space:nowrap;color:var(--tamago);
    text-shadow:0 2px 6px rgba(0,0,0,.8);
  }
  #ring.hide-label::after{content:""}
  #ring.hit{animation:ringHit .45s ease-out}
  @keyframes ringHit{
    0%{box-shadow:0 0 0 3px rgba(22,32,43,.35) inset, 0 0 0 0 rgba(255,197,61,.7)}
    100%{box-shadow:0 0 0 3px rgba(22,32,43,.35) inset, 0 0 0 26px rgba(255,197,61,0)}
  }
  /* うごきを見ない（てどう）モード。hide-label より後に置いて ラベルを 上書きする */
  #ring.off{opacity:.28;border-style:dotted;border-color:rgba(255,246,230,.7);box-shadow:none;animation:none}
  #ring.off::after{content:"てどうモード：みぎしたの「たべた！」で すすみます";color:rgba(255,246,230,.85)}

  /* ---- 弁当箱（シグネチャー要素） ---- */
  #bento{
    position:absolute;left:50%;bottom:calc(14px + var(--pad));transform:translateX(-50%);
    display:grid;grid-template-columns:repeat(6,1fr);gap:6px;
    padding:8px;border-radius:16px;
    background:linear-gradient(180deg,#2B1B14,#3A241B);
    border:3px solid #59392A;box-shadow:0 10px 24px rgba(0,0,0,.45);
    width:min(92vw,460px);
  }
  .cell{
    aspect-ratio:1/1;border-radius:10px;background:rgba(255,246,230,.10);
    display:grid;place-items:center;font-size:clamp(18px,5.5vw,30px);
    transition:transform .25s ease, background .25s ease;
  }
  .cell.filled{background:var(--rice);transform:scale(1)}
  .cell.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(.2) rotate(-18deg)}100%{transform:scale(1) rotate(0)}}

  /* ---- ロケット（はっしゃ台の ちいさい ほう） ---- */
  #rocket{
    position:absolute;left:12px;bottom:calc(var(--deck) + var(--pad));
    display:flex;align-items:flex-end;gap:8px;pointer-events:none;
  }
  #gauge{
    width:16px;height:112px;padding:2px;border-radius:999px;
    background:rgba(22,32,43,.72);border:1px solid rgba(255,246,230,.22);
    display:flex;flex-direction:column-reverse;gap:2px;backdrop-filter:blur(6px);
  }
  #gauge .seg{flex:1;min-height:3px;border-radius:4px;background:rgba(255,246,230,.12);transition:background .3s ease, box-shadow .3s ease}
  #gauge .seg.on{background:linear-gradient(180deg,var(--ume),var(--tamago));box-shadow:0 0 8px rgba(255,197,61,.8)}
  #ship{display:flex;flex-direction:column;align-items:center;transform-origin:50% 100%;transition:opacity .3s ease}
  #ship.gone{opacity:0}
  #shipBody{
    font-size:42px;line-height:1;display:inline-block;transform:rotate(-45deg);
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));
  }
  #flame{
    width:14px;height:0;margin-top:-4px;
    border-radius:0 0 60% 60% / 0 0 100% 100%;
    background:linear-gradient(180deg,#FFF6E6,var(--tamago) 45%,var(--ume));
    filter:blur(.6px);transition:height .35s cubic-bezier(.2,1.6,.4,1);
  }
  #flame.lit{animation:flick .1s infinite alternate}
  @keyframes flick{from{transform:scaleX(1) scaleY(1);opacity:.85}to{transform:scaleX(.75) scaleY(1.2);opacity:1}}
  #ship.ready{animation:hop .7s ease-in-out infinite}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

  /* ---- 大ロケット（画面まんなかで ドカーン） ---- */
  #bigRocket{
    position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
    display:none;pointer-events:none;z-index:4;
  }
  #bigRocket.on{display:block}
  #bigStack{display:flex;flex-direction:column;align-items:center;transform-origin:50% 100%}
  #bigShip{
    font-size:clamp(96px,36vmin,260px);line-height:1;display:inline-block;
    transform:rotate(-45deg);filter:drop-shadow(0 12px 28px rgba(0,0,0,.65));
  }
  #bigFlame{
    width:clamp(26px,9vmin,64px);height:0;margin-top:-10px;
    border-radius:0 0 55% 55% / 0 0 100% 100%;
    background:linear-gradient(180deg,#FFFFFF,#FFF6E6 18%,var(--tamago) 50%,var(--ume));
    filter:blur(1.5px);transition:height .4s cubic-bezier(.2,1.6,.4,1);
  }
  #bigFlame.lit{animation:bigFlick .08s infinite alternate}
  @keyframes bigFlick{from{transform:scaleX(1) scaleY(.94);opacity:.85}to{transform:scaleX(.72) scaleY(1.24);opacity:1}}
  #bigStack.arrive{animation:arrive .7s cubic-bezier(.2,1.5,.35,1)}
  @keyframes arrive{
    0%{transform:translateY(60vh) scale(.25);opacity:0}
    55%{opacity:1}
    100%{transform:translateY(0) scale(1);opacity:1}
  }
  #bigStack.rev{animation:rev .07s linear infinite}
  @keyframes rev{
    0%,100%{transform:translate(0,0)}
    25%{transform:translate(-4px,2px)}
    50%{transform:translate(4px,-2px)}
    75%{transform:translate(-2px,-4px)}
  }
  #bigStack.blast{animation:blast 1.9s cubic-bezier(.6,0,.9,.35) forwards}
  @keyframes blast{
    0%{transform:translateY(0) scale(1)}
    8%{transform:translateY(26px) scale(1.04)}
    100%{transform:translateY(-160vh) scale(.75)}
  }

  /* ---- しょうげきは ---- */
  #shock{
    position:absolute;left:50%;top:52%;width:22vmin;height:22vmin;
    margin:-11vmin 0 0 -11vmin;border-radius:50%;
    border:9px solid rgba(255,197,61,.9);opacity:0;pointer-events:none;z-index:3;
  }
  #shock.on{animation:shock 1s cubic-bezier(.12,.7,.3,1)}
  @keyframes shock{
    0%{opacity:.95;transform:scale(.15);border-width:14px}
    100%{opacity:0;transform:scale(6.5);border-width:2px}
  }

  #stage.shake{animation:shake .09s linear infinite}
  @keyframes shake{
    0%,100%{transform:translate(0,0)}
    25%{transform:translate(-3px,2px)}
    50%{transform:translate(3px,-2px)}
    75%{transform:translate(-2px,-3px)}
  }
  #stage.shake.hard{animation:shakeHard .06s linear infinite}
  @keyframes shakeHard{
    0%,100%{transform:translate(0,0)}
    20%{transform:translate(-9px,6px)}
    40%{transform:translate(8px,-7px)}
    60%{transform:translate(-7px,-8px)}
    80%{transform:translate(9px,5px)}
  }
  #flash{position:absolute;inset:0;background:var(--rice);opacity:0;pointer-events:none;z-index:2}
  #flash.on{animation:flash .6s ease-out}
  @keyframes flash{0%{opacity:.62}100%{opacity:0}}

  #shout{
    position:absolute;left:50%;top:12%;transform:translate(-50%,0) scale(.6);
    font-size:clamp(34px,11vw,72px);font-weight:800;letter-spacing:.04em;
    color:var(--tamago);text-shadow:0 0 18px rgba(0,0,0,.6),0 6px 0 #C8892A;
    opacity:0;pointer-events:none;z-index:5;
  }
  #shout.show{animation:shout 1.1s ease-out}
  #shout.count{animation:count .55s ease-out;font-size:clamp(64px,22vw,140px);color:var(--rice)}
  @keyframes shout{
    0%{opacity:0;transform:translate(-50%,20px) scale(.6)}
    18%{opacity:1;transform:translate(-50%,0) scale(1.08)}
    70%{opacity:1;transform:translate(-50%,0) scale(1)}
    100%{opacity:0;transform:translate(-50%,-24px) scale(1)}
  }
  @keyframes count{
    0%{opacity:0;transform:translate(-50%,0) scale(2.2)}
    30%{opacity:1;transform:translate(-50%,0) scale(1)}
    100%{opacity:0;transform:translate(-50%,0) scale(.85)}
  }

  /* ---- コントロール ---- */
  #topbar{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;gap:8px;align-items:center;z-index:6}
  .badge{
    background:rgba(22,32,43,.72);border:1px solid rgba(255,246,230,.18);
    padding:7px 12px;border-radius:999px;font-size:13px;backdrop-filter:blur(6px)
  }
  .spacer{flex:1}
  button{
    font:inherit;color:var(--rice);background:rgba(22,32,43,.72);
    border:1px solid rgba(255,246,230,.2);border-radius:999px;padding:10px 14px;
    backdrop-filter:blur(6px);cursor:pointer;
  }
  button:focus-visible{outline:3px solid var(--sora);outline-offset:2px}
  button.primary{background:var(--tamago);color:#2A1B06;border-color:#C8892A;font-weight:800}
  button.ghost{background:rgba(22,32,43,.55)}

  /* いつでも すぐ押せる「たべた！」ボタン */
  #biteBtn{
    position:absolute;right:12px;bottom:calc(var(--deck) + var(--pad));
    width:104px;height:104px;padding:0;border-radius:50%;
    font-size:19px;font-weight:800;letter-spacing:.02em;z-index:6;
    box-shadow:0 10px 26px rgba(0,0,0,.5), 0 0 0 6px rgba(255,197,61,.18);
    touch-action:manipulation;
  }
  #biteBtn:active{transform:scale(.93)}
  #biteBtn.tapped{animation:tapped .4s ease-out}
  @keyframes tapped{
    0%{box-shadow:0 10px 26px rgba(0,0,0,.5), 0 0 0 0 rgba(255,197,61,.6)}
    100%{box-shadow:0 10px 26px rgba(0,0,0,.5), 0 0 0 28px rgba(255,197,61,0)}
  }

  #panel{
    position:absolute;left:50%;bottom:calc(var(--deck) + 12px + var(--pad));transform:translateX(-50%);
    width:min(92vw,460px);max-height:66vh;overflow-y:auto;
    background:rgba(22,32,43,.92);border:1px solid rgba(255,246,230,.16);
    border-radius:var(--radius);padding:14px 16px;display:none;gap:12px;flex-direction:column;
    box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:7;
  }
  #panel.open{display:flex}
  .row{display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:14px}
  .row label{white-space:nowrap}
  .val{min-width:2.2em;text-align:right;font-weight:800;color:var(--tamago)}
  input[type=range]{flex:1;accent-color:var(--tamago)}
  .hint{font-size:12px;line-height:1.6;color:rgba(255,246,230,.72)}

  #start{
    position:absolute;inset:0;display:grid;place-items:center;text-align:center;
    background:radial-gradient(120% 90% at 50% 20%,#22303F,#0C141C);padding:24px;z-index:8;
  }
  #start h1{font-size:clamp(30px,9vw,52px);margin:0 0 6px;color:var(--tamago);letter-spacing:.06em}
  #start p{margin:0 0 22px;line-height:1.8;font-size:15px;color:rgba(255,246,230,.82)}
  #start .big{padding:16px 30px;font-size:18px}
  #err{margin-top:14px;color:var(--ume);font-size:13px;min-height:1em}
  .hidden{display:none !important}
  @media (prefers-reduced-motion: reduce){
    #shout.show{animation-duration:.6s}
    .cell.pop{animation:none}
    #ring.hit{animation:none}
    #flame.lit,#bigFlame.lit{animation:none}
    #ship.ready{animation:none}
    #bigStack.rev{animation:none}
    #stage.shake,#stage.shake.hard{animation:none}
    #flash.on{animation:none}
    #shock.on{animation-duration:.5s}
    #biteBtn.tapped{animation:none}
    #bigStack.arrive{animation-duration:.35s}
    #bigStack.blast{animation-duration:1s}
  }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="fx"></canvas>
  <div id="ring" role="slider" aria-label="口の位置" tabindex="0"></div>
  <div id="shock"></div>
  <div id="bigRocket" aria-hidden="true">
    <div id="bigStack">
      <div id="bigShip">🚀</div>
      <div id="bigFlame"></div>
    </div>
  </div>
  <div id="flash"></div>
  <div id="shout"></div>

  <div id="topbar" class="hidden">
    <div class="badge" id="counter">ひとくち 0</div>
    <div class="spacer"></div>
    <button id="flipBtn" class="ghost" aria-label="カメラを切り替える">切替</button>
    <button id="gearBtn" class="ghost" aria-label="設定を開く">設定</button>
  </div>

  <div id="rocket" class="hidden" aria-hidden="true">
    <div id="gauge"></div>
    <div id="ship">
      <div id="shipBody">🚀</div>
      <div id="flame"></div>
    </div>
  </div>

  <button id="biteBtn" class="primary hidden" aria-label="いま たべた">たべた！</button>

  <div id="bento" class="hidden" aria-label="おべんとう"></div>

  <div id="panel">
    <div class="row">
      <label for="goal">なんくちで かんせい</label>
      <input id="goal" type="range" min="2" max="12" step="1" value="6">
      <span class="val" id="goalVal">6</span>
    </div>
    <div class="row"><label for="detect">うごきを みる</label><input id="detect" type="checkbox" checked></div>
    <div class="row"><label for="sens">はんのう しやすさ</label><input id="sens" type="range" min="1" max="10" value="5"></div>
    <div class="row">
      <label for="ringSize">わっかの おおきさ</label>
      <input id="ringSize" type="range" min="14" max="60" step="1" value="34">
      <span class="val" id="ringSizeVal">34</span>
    </div>
    <div class="row"><label for="snd">おと</label><input id="snd" type="checkbox" checked></div>
    <div class="row"><label for="voice">ほめる こえ</label><input id="voice" type="checkbox" checked></div>
    <div class="row"><label for="rocketChk">ロケット</label><input id="rocketChk" type="checkbox" checked></div>
    <div class="row">
      <button id="manualBtn" class="primary">いま たべた！</button>
      <button id="resetBtn" class="ghost">さいしょから</button>
    </div>
    <p class="hint">かってに はんのうしすぎる ときは「うごきを みる」を オフにして、みぎしたの「たべた！」を おうちのひとが タップしてください。オンのままなら「はんのう しやすさ」を さげるか、わっかを ちいさくすると おちつきます。わっかは ドラッグで いどう、2ほんゆび（パソコンは ホイール）で おおきさが かわります。</p>
  </div>

  <div id="start">
    <div>
      <h1>もぐもぐカメラ</h1>
      <p>カメラに うつった おくちが うごくと<br>おべんとうと ロケットの ねんりょうが<br>ひとつずつ たまります。<br>ぜんぶ たべたら はっしゃ！</p>
      <button id="startBtn" class="primary big">カメラを つける</button>
      <div id="err" role="status"></div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const stage=$("stage"), video=$("video"), fx=$("fx"), ring=$("ring"), shout=$("shout"), flash=$("flash");
  const bento=$("bento"), counter=$("counter"), errBox=$("err");
  const panel=$("panel"), sens=$("sens"), sndOn=$("snd"), voiceOn=$("voice");
  const ringSizeInput=$("ringSize"), ringSizeVal=$("ringSizeVal");
  const goalInput=$("goal"), goalVal=$("goalVal");
  const detectOn=$("detect"), rocketChk=$("rocketChk");
  const rocket=$("rocket"), gauge=$("gauge"), ship=$("ship"), flame=$("flame");
  const bigRocket=$("bigRocket"), bigStack=$("bigStack"), bigFlame=$("bigFlame"), shock=$("shock");
  const biteBtn=$("biteBtn");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const OKAZU=["🍙","🥚","🥦","🍅","🍤","🍓"];
  const PRAISE=["もぐもぐ！","すごい！","やったね！","じょうず！","いいね！","ナイス！"];
  const VOICE_LINES=["もぐもぐ、じょうず！","すごいね！","おいしそう！","もうひとくち いけるかな","ナイスもぐもぐ！"];
  const STORE_KEY="mogumogu-camera:v1";
  const GOAL_MIN=2, GOAL_MAX=12;

  let stream=null, facing="user", bites=0, filled=0, goal=6, running=false, launching=false;
  let ringPos={x:.5,y:.55}, ringVmin=34, ringR=.17;   // 画面比率
  let lastTrigger=0, baseline=0, warm=0;
  let prevGray=null;

  /* ---------- 設定の ほぞん と ふっき ---------- */
  function save(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify({
        ringVmin, ringPos, goal, sens:sens.value,
        detect:detectOn.checked, snd:sndOn.checked,
        voice:voiceOn.checked, rocket:rocketChk.checked
      }));
    }catch(e){}
  }
  function load(){
    try{
      const s=JSON.parse(localStorage.getItem(STORE_KEY)||"null");
      if(!s) return;
      if(typeof s.ringVmin==="number") ringVmin=Math.min(60,Math.max(14,s.ringVmin));
      if(s.ringPos && typeof s.ringPos.x==="number") ringPos={x:s.ringPos.x,y:s.ringPos.y};
      if(typeof s.goal==="number") goal=Math.min(GOAL_MAX,Math.max(GOAL_MIN,Math.round(s.goal)));
      if(s.sens) sens.value=s.sens;
      if(typeof s.detect==="boolean") detectOn.checked=s.detect;
      if(typeof s.snd==="boolean") sndOn.checked=s.snd;
      if(typeof s.voice==="boolean") voiceOn.checked=s.voice;
      if(typeof s.rocket==="boolean") rocketChk.checked=s.rocket;
    }catch(e){}
  }

  /* ---------- 弁当箱と ねんりょうゲージを くみ直す ---------- */
  let cells=[], segs=[];
  function buildBoard(){
    bento.innerHTML=""; gauge.innerHTML=""; cells=[]; segs=[];
    // 8マスを こえたら 2だんに して 1マスが 小さくなりすぎないように する
    const cols = goal<=6 ? goal : Math.ceil(goal/2);
    bento.style.gridTemplateColumns="repeat("+cols+",1fr)";
    // 1マスが 大きくなりすぎないよう、列数から 弁当箱の 横はばを 決める
    bento.style.width="min(92vw,"+(cols*76)+"px)";
    for(let i=0;i<goal;i++){
      const c=document.createElement("div");
      c.className="cell"; c.setAttribute("aria-label","マス"+(i+1));
      bento.appendChild(c); cells.push(c);
      const s=document.createElement("div");
      s.className="seg"; gauge.appendChild(s); segs.push(s);
    }
    gauge.style.height=Math.min(190,Math.max(112,goal*16))+"px";
    goalInput.value=goal; goalVal.textContent=goal;
    layoutDeck();
  }
  // 弁当箱の 高さを 実測して、ボタン・ロケット・パネルの 足元を そろえる
  function layoutDeck(){
    const h=bento.getBoundingClientRect().height;
    if(h>0) document.documentElement.style.setProperty("--deck", Math.round(h+26)+"px");
  }
  function paintCells(){
    cells.forEach((c,i)=>{
      if(i<filled){ c.textContent=OKAZU[i%OKAZU.length]; c.classList.add("filled"); }
      else { c.textContent=""; c.classList.remove("filled"); }
    });
  }
  function setGoal(n){
    const next=Math.min(GOAL_MAX,Math.max(GOAL_MIN,Math.round(n)));
    if(next===goal){ goalVal.textContent=goal; return; }
    goal=next;
    filled=Math.min(filled,goal);
    buildBoard(); paintCells(); updateRocket(); save();
    // へらして すでに とどいていたら そのまま おいわいへ
    if(filled>=goal && !launching && running) completeSequence();
  }

  function updateRocket(){
    segs.forEach((s,i)=>s.classList.toggle("on", i<filled));
    const step=Math.max(3, Math.round(38/goal));      // ゴールが 多くても 炎が はみ出さない
    flame.style.height = filled? (8+filled*step)+"px" : "0px";
    flame.classList.toggle("lit", filled>0 && !reduceMotion);
    ship.classList.toggle("ready", filled>=goal-1 && filled<goal && !launching && !reduceMotion);
  }
  function showRocket(){
    rocket.classList.toggle("hidden", !(running && rocketChk.checked));
  }
  // うごき検知の オン／オフを 見た目に 反映する
  function applyDetectMode(){
    ring.classList.toggle("off", !detectOn.checked);
    if(detectOn.checked){ prevGray=null; warm=0; baseline=0; }
  }

  /* ---------- カメラ ---------- */
  async function startCamera(){
    errBox.textContent="";
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      errBox.textContent="このブラウザは カメラに対応していません。Safari または Chrome の最新版でひらいてください。";
      return;
    }
    try{
      if(stream) stream.getTracks().forEach(t=>t.stop());
      stream = await navigator.mediaDevices.getUserMedia({
        video:{facingMode:facing, width:{ideal:960}, height:{ideal:720}}, audio:false
      });
      video.srcObject=stream;
      video.classList.toggle("mirror", facing==="user");
      await video.play();
      $("start").classList.add("hidden");
      $("topbar").classList.remove("hidden");
      bento.classList.remove("hidden");
      biteBtn.classList.remove("hidden");
      running=true; prevGray=null; baseline=0; warm=0;
      showRocket(); updateRocket(); layoutDeck();
      resize(); loop();
    }catch(e){
      errBox.textContent = (e && e.name==="NotAllowedError")
        ? "カメラの きょかが 必要です。ブラウザの設定でカメラを「許可」にしてから もういちど おためしください。"
        : "カメラを ひらけませんでした（"+(e&&e.name||"不明")+"）。ほかのアプリがカメラを使っていないか ご確認ください。";
    }
  }

  /* ---------- 検知（フレーム差分） ---------- */
  const work=document.createElement("canvas"); work.width=96; work.height=72;
  const wctx=work.getContext("2d",{willReadFrequently:true});

  function detect(){
    if(!video.videoWidth) return;
    wctx.drawImage(video,0,0,work.width,work.height);
    const d=wctx.getImageData(0,0,work.width,work.height).data;
    const n=work.width*work.height;
    const gray=new Float32Array(n);
    for(let i=0;i<n;i++){
      const p=i*4;
      gray[i]=(d[p]*0.299+d[p+1]*0.587+d[p+2]*0.114);
    }
    if(!prevGray){ prevGray=gray; return; }

    // ROI（わっかの内側）だけを見る
    const cx=ringPos.x*work.width, cy=ringPos.y*work.height;
    const rr=ringR*Math.min(work.width,work.height)*1.6;
    let sum=0,count=0;
    const x0=Math.max(0,(cx-rr)|0), x1=Math.min(work.width,(cx+rr)|0);
    const y0=Math.max(0,(cy-rr)|0), y1=Math.min(work.height,(cy+rr)|0);
    for(let y=y0;y<y1;y++){
      for(let x=x0;x<x1;x++){
        const dx=x-cx, dy=y-cy;
        if(dx*dx+dy*dy>rr*rr) continue;
        const i=y*work.width+x;
        sum+=Math.abs(gray[i]-prevGray[i]); count++;
      }
    }
    prevGray=gray;
    if(!count) return;
    const mean=sum/count;

    if(warm<30){ warm++; baseline=baseline?baseline*0.9+mean*0.1:mean; return; }
    baseline=baseline*0.97+mean*0.03;           // ゆっくり順応（明るさ変化に強く）
    const score=mean-baseline;
    const threshold=14 - (+sens.value);          // 感度1→13, 10→4
    const now=performance.now();
    if(score>threshold && now-lastTrigger>2000){
      lastTrigger=now;
      onBite();
    }
  }

  /* ---------- ごほうび ---------- */
  function onBite(){
    bites++;
    counter.textContent="ひとくち "+bites;

    // わっかが ぱっと ひろがる
    if(detectOn.checked){
      ring.classList.remove("hit"); void ring.offsetWidth; ring.classList.add("hit");
    }

    const idx=filled%OKAZU.length;
    shout.textContent=PRAISE[Math.floor(Math.random()*PRAISE.length)];
    shout.classList.remove("show","count"); void shout.offsetWidth; shout.classList.add("show");
    burst(ringPos.x*fx.width, ringPos.y*fx.height, reduceMotion?10:28, OKAZU[idx]);
    if(voiceOn.checked) speak(VOICE_LINES[Math.floor(Math.random()*VOICE_LINES.length)]);

    // 発射シーケンス中は カウントだけ すすめる
    if(launching){ chime(idx); return; }

    const cell=cells[filled];
    if(cell){
      cell.textContent=OKAZU[filled%OKAZU.length];
      cell.classList.add("filled","pop");
      setTimeout(()=>cell.classList.remove("pop"),520);
    }

    filled++;
    updateRocket();
    chime(filled-1);
    charge(filled/goal);                              // ねんりょうが たまる音
    if(rocketChk.checked && !reduceMotion){
      const r=ship.getBoundingClientRect();
      exhaust(r.left+r.width/2, r.bottom, 7);         // ちいさな 噴射
    }

    if(filled>=goal) completeSequence();
  }

  /* ---------- かんせい → 大ロケット はっしゃ ---------- */
  let seqTimers=[], exhaustTimer=null;
  function later(fn,ms){ seqTimers.push(setTimeout(fn,ms)); }
  function clearSeq(){
    seqTimers.forEach(clearTimeout); seqTimers=[];
    if(exhaustTimer){ clearInterval(exhaustTimer); exhaustTimer=null; }
  }
  function say(text,isCount){
    shout.textContent=text;
    shout.classList.remove("show","count"); void shout.offsetWidth;
    shout.classList.add(isCount?"count":"show");
  }
  function hideBigRocket(){
    bigRocket.classList.remove("on");
    bigStack.classList.remove("arrive","rev","blast");
    bigFlame.classList.remove("lit");
    bigFlame.style.height="0px";
    ship.classList.remove("gone");
  }
  function resetBoard(){
    filled=0;
    paintCells();
    hideBigRocket();
    ship.classList.remove("ready");
    updateRocket();
  }

  function completeSequence(){
    launching=true;
    ship.classList.remove("ready");

    later(()=>{
      say("おべんとう かんせい！");
      fanfare();
      if(voiceOn.checked) speak("ぜんぶ たべられたね、すごい！");
    },600);

    // ロケットを つかわない ときは 紙ふぶきだけの おいわい
    if(!rocketChk.checked){
      for(let i=0;i<(reduceMotion?2:6);i++){
        later(()=>burst(Math.random()*fx.width, fx.height*(0.2+Math.random()*0.5), 24), 700+i*160);
      }
      later(()=>{ resetBoard(); launching=false; },3000);
      return;
    }

    // 1.4s : はっしゃ台の ロケットが 画面まんなかに 大きく せり上がる
    later(()=>{
      ship.classList.add("gone");
      bigRocket.classList.add("on");
      bigStack.classList.remove("rev","blast");
      void bigStack.offsetWidth; bigStack.classList.add("arrive");
      bigFlame.style.height="26px";
      if(!reduceMotion) bigFlame.classList.add("lit");
      whoosh();
    },1400);

    // 2.1s : エンジンを ふかして ぶるぶる ふるえる
    later(()=>{
      bigStack.classList.remove("arrive");
      void bigStack.offsetWidth;
      if(!reduceMotion) bigStack.classList.add("rev");
      stage.classList.add("shake");
    },2100);

    // 3・2・1 の カウントダウン。かぞえる ごとに 炎が のびる
    ["3","2","1"].forEach((t,i)=>{
      later(()=>{
        say(t,true); beep(560+i*120);
        bigFlame.style.height=(40+i*22)+"px";
        if(!reduceMotion){
          const r=bigFlame.getBoundingClientRect();
          exhaust(r.left+r.width/2, r.bottom, 8+i*4);
        }
      },2200+i*600);
    });

    // 4.0s : ドカーン
    later(()=>{
      say("はっしゃ！");
      if(voiceOn.checked) speak("ロケット、はっしゃ！");
      bigStack.classList.remove("rev");
      void bigStack.offsetWidth; bigStack.classList.add("blast");
      bigFlame.style.height="110px";

      if(!reduceMotion){
        flash.classList.remove("on"); void flash.offsetWidth; flash.classList.add("on");
        stage.classList.add("hard");
      }
      shock.classList.remove("on"); void shock.offsetWidth; shock.classList.add("on");
      rumble(2.4);

      const r0=bigFlame.getBoundingClientRect();
      smoke(r0.left+r0.width/2, r0.bottom, reduceMotion?6:22);
      exhaustTimer=setInterval(()=>{
        const r=bigFlame.getBoundingClientRect();
        if(r.bottom<-60) return;
        exhaust(r.left+r.width/2, r.bottom, reduceMotion?3:9);
      },55);
      later(()=>{ if(exhaustTimer){ clearInterval(exhaustTimer); exhaustTimer=null; } },1900);

      // 星の おいわい
      for(let i=0;i<(reduceMotion?2:7);i++){
        later(()=>burst(Math.random()*fx.width, fx.height*(0.12+Math.random()*0.55), 22), i*170);
      }
    },4000);

    later(()=>stage.classList.remove("shake","hard"),5900);
    later(()=>{
      say("また あしたも たべようね");
      resetBoard();
      launching=false;
    },6400);
  }

  /* ---------- パーティクル ----------
     1粒ごとに createRadialGradient・ctx.font 代入・fillText をすると
     フレーム時間が跳ね上がる（実測: 絵文字400個で28ms／火花800個で17.6ms）。
     絵柄は起動時に一度だけ小さなキャンバスへ焼いておき、
     毎フレームは drawImage で貼るだけにする。→ CLAUDE.md「エフェクトのルール」 */
  const ctx=fx.getContext("2d");
  let parts=[];
  const SHAPES=["⭐","✨","🎉","💫","🌈","🍀"];
  const MAX_PARTS=460;          // 同時に 生きていられる 粒の 上限
  let fxScale=1;                // 重いときに 自動で さがる 量の 係数

  /* --- 絵柄を 起動時に 焼いておく（スプライト） --- */
  const SPR=64;
  function makeSprite(paint){
    const c=document.createElement("canvas"); c.width=c.height=SPR;
    paint(c.getContext("2d")); return c;
  }
  const SPARK_HUES=6;
  const sparkSpr=[];
  for(let i=0;i<SPARK_HUES;i++){
    const hue=18+i*(36/SPARK_HUES);
    sparkSpr.push(makeSprite(g2=>{
      const g=g2.createRadialGradient(SPR/2,SPR/2,0,SPR/2,SPR/2,SPR/2);
      g.addColorStop(0,"rgba(255,252,235,1)");
      g.addColorStop(.45,"hsla("+hue+",100%,62%,.85)");
      g.addColorStop(1,"hsla("+hue+",100%,50%,0)");
      g2.fillStyle=g; g2.fillRect(0,0,SPR,SPR);
    }));
  }
  const smokeSpr=makeSprite(g2=>{
    const g=g2.createRadialGradient(SPR/2,SPR/2,0,SPR/2,SPR/2,SPR/2);
    g.addColorStop(0,"rgba(198,205,216,.34)");
    g.addColorStop(.6,"rgba(198,205,216,.22)");
    g.addColorStop(1,"rgba(198,205,216,0)");
    g2.fillStyle=g; g2.fillRect(0,0,SPR,SPR);
  });
  const glyphSpr=Object.create(null);
  function glyph(ch){
    let s=glyphSpr[ch];
    if(!s){
      s=makeSprite(g2=>{
        g2.font=Math.round(SPR*0.78)+"px serif";
        g2.textAlign="center"; g2.textBaseline="middle";
        g2.fillText(ch,SPR/2,SPR/2);
      });
      glyphSpr[ch]=s;
    }
    return s;
  }
  OKAZU.concat(SHAPES).forEach(glyph);   // つかう絵文字は さきに 焼いておく

  // 上限を こえたぶんは 古いものから 捨てる（新しい配列は つくらない）
  function trim(){ if(parts.length>MAX_PARTS) parts.splice(0,parts.length-MAX_PARTS); }
  // 量の係数を かけた 個数。0個には しない
  function amount(n){ return Math.max(1,Math.round(n*fxScale)); }

  function burst(x,y,n,extra){
    n=amount(n);
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, s=2+Math.random()*7;
      const ch=(extra && Math.random()<0.35) ? extra : SHAPES[Math.floor(Math.random()*SHAPES.length)];
      parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,life:1,
        spr:glyph(ch), size:16+Math.random()*26, rot:Math.random()*6});
    }
    trim();
  }
  // ロケットの ふんしゃ（したむきの ひのこ）
  function exhaust(x,y,n){
    n=amount(n);
    for(let i=0;i<n;i++){
      const a=Math.PI/2+(Math.random()-.5)*0.9, s=2+Math.random()*9;
      parts.push({kind:"spark",x:x+(Math.random()-.5)*22,y,
        vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:0.026+Math.random()*0.022,
        grav:0.03,size:9+Math.random()*17,rot:0,
        spr:sparkSpr[(Math.random()*SPARK_HUES)|0]});
    }
    trim();
  }
  // はっしゃの けむり
  function smoke(x,y,n){
    n=amount(n);
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, s=1+Math.random()*6;
      parts.push({kind:"smoke",x,y,vx:Math.cos(a)*s,vy:Math.abs(Math.sin(a))*s*0.5,
        life:1,decay:0.010+Math.random()*0.010,grav:-0.01,size:12+Math.random()*22,
        rot:0,spr:smokeSpr});
    }
    trim();
  }

  // 種類ごとに まとめて 描き、合成モードの きりかえを 2回に おさえる。
  // save / restore は 1粒ごとには 呼ばない。
  function drawParts(){
    ctx.clearRect(0,0,fx.width,fx.height);
    if(!parts.length) return;
    let hasSpark=false;
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i];
      p.x+=p.vx; p.y+=p.vy;
      p.vy+=(p.grav!==undefined?p.grav:0.28); p.vx*=0.99;
      p.life-=(p.decay!==undefined?p.decay:0.016);
      if(p.life<=0){ parts.splice(i,1); continue; }
      if(p.kind==="spark") hasSpark=true; else p.rot+=0.08;
    }
    if(hasSpark){                       // 1) 火花（加算合成）
      ctx.globalCompositeOperation="lighter";
      for(let i=0;i<parts.length;i++){
        const p=parts[i];
        if(p.kind!=="spark") continue;
        ctx.globalAlpha=p.life;
        ctx.drawImage(p.spr,p.x-p.size,p.y-p.size,p.size*2,p.size*2);
      }
      ctx.globalCompositeOperation="source-over";
    }
    for(let i=0;i<parts.length;i++){    // 2) けむりと 絵文字
      const p=parts[i];
      if(p.kind==="spark") continue;
      ctx.globalAlpha=p.life;
      if(p.kind==="smoke"){
        const r=p.size*(2.2-p.life);
        ctx.drawImage(p.spr,p.x-r,p.y-r,r*2,r*2);
      }else{
        const d=p.size*1.3;
        ctx.setTransform(1,0,0,1,p.x,p.y);
        ctx.rotate(p.rot);
        ctx.drawImage(p.spr,-d/2,-d/2,d,d);
        ctx.setTransform(1,0,0,1,0,0);
      }
    }
    ctx.globalAlpha=1;
  }
  /* ---------- 音 ---------- */
  let ac=null;
  function audio(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(ac && ac.state==="suspended") ac.resume(); return ac; }
  function tone(freq,start,dur,vol,type){
    const a=audio(); if(!a||!sndOn.checked) return;
    const o=a.createOscillator(), g=a.createGain();
    o.type=type||"triangle"; o.frequency.value=freq;
    g.gain.setValueAtTime(0,a.currentTime+start);
    g.gain.linearRampToValueAtTime(vol,a.currentTime+start+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+start+dur);
    o.connect(g); g.connect(a.destination);
    o.start(a.currentTime+start); o.stop(a.currentTime+start+dur+0.05);
  }
  function chime(i){
    const scale=[523,587,659,784,880,1047];
    tone(scale[i%scale.length],0,0.28,0.18);
    tone(scale[i%scale.length]*2,0.06,0.22,0.08);
  }
  function fanfare(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*0.12,0.4,0.16)); }
  function beep(f){ tone(f,0,0.18,0.2,"square"); }
  // ねんりょうが たまる音。ratio は 0〜1 の たまりぐあい
  function charge(ratio){
    const a=audio(); if(!a||!sndOn.checked) return;
    const o=a.createOscillator(), g=a.createGain();
    o.type="sawtooth";
    o.frequency.setValueAtTime(90+ratio*110,a.currentTime);
    o.frequency.linearRampToValueAtTime(150+ratio*260,a.currentTime+0.34);
    g.gain.setValueAtTime(0.0001,a.currentTime);
    g.gain.linearRampToValueAtTime(0.05+ratio*0.07,a.currentTime+0.08);
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.4);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime+0.45);
  }
  // 大ロケットが せり上がる ときの 風きり音
  function whoosh(){
    const a=audio(); if(!a||!sndOn.checked) return;
    const dur=0.6, len=Math.floor(a.sampleRate*dur);
    const buf=a.createBuffer(1,len,a.sampleRate);
    const ch=buf.getChannelData(0);
    for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1);
    const src=a.createBufferSource(); src.buffer=buf;
    const f=a.createBiquadFilter(); f.type="bandpass"; f.Q.value=1.4;
    f.frequency.setValueAtTime(300,a.currentTime);
    f.frequency.exponentialRampToValueAtTime(2600,a.currentTime+dur);
    const g=a.createGain();
    g.gain.setValueAtTime(0.0001,a.currentTime);
    g.gain.linearRampToValueAtTime(0.14,a.currentTime+0.12);
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
    src.connect(f); f.connect(g); g.connect(a.destination);
    src.start(); src.stop(a.currentTime+dur+0.05);
  }
  // はっしゃの ごうおん（ノイズ＋ひくい スイープ）
  function rumble(dur){
    const a=audio(); if(!a||!sndOn.checked) return;
    const len=Math.floor(a.sampleRate*dur);
    const buf=a.createBuffer(1,len,a.sampleRate);
    const ch=buf.getChannelData(0);
    for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*(1-i/len);
    const src=a.createBufferSource(); src.buffer=buf;
    const f=a.createBiquadFilter(); f.type="lowpass";
    f.frequency.setValueAtTime(300,a.currentTime);
    f.frequency.linearRampToValueAtTime(1800,a.currentTime+dur*0.35);
    f.frequency.linearRampToValueAtTime(400,a.currentTime+dur);
    const g=a.createGain();
    g.gain.setValueAtTime(0.0001,a.currentTime);
    g.gain.linearRampToValueAtTime(0.26,a.currentTime+0.1);
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
    src.connect(f); f.connect(g); g.connect(a.destination);
    src.start(); src.stop(a.currentTime+dur+0.05);

    const o=a.createOscillator(), og=a.createGain();
    o.type="sawtooth";
    o.frequency.setValueAtTime(65,a.currentTime);
    o.frequency.linearRampToValueAtTime(200,a.currentTime+dur*0.6);
    o.frequency.linearRampToValueAtTime(55,a.currentTime+dur);
    og.gain.setValueAtTime(0.0001,a.currentTime);
    og.gain.linearRampToValueAtTime(0.15,a.currentTime+0.1);
    og.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
    o.connect(og); og.connect(a.destination);
    o.start(); o.stop(a.currentTime+dur+0.05);
  }
  function speak(text){
    if(!("speechSynthesis" in window)) return;
    try{
      const u=new SpeechSynthesisUtterance(text);
      u.lang="ja-JP"; u.rate=1.05; u.pitch=1.3;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    }catch(e){}
  }

  /* ---------- ループ ---------- */
  let acc=0, last=0, frameMs=16;
  function loop(t){
    if(!running) return;
    requestAnimationFrame(loop);
    const now=t||0;
    if(!last) last=now;
    const dt=now-last; last=now;
    // フレーム時間を ならして 見はる。タブ復帰などの 大きな とびは 数えない
    if(dt>0 && dt<100){
      frameMs=frameMs*0.9+dt*0.1;
      // 重い端末では エフェクトの量を さげ、余裕が できたら ゆっくり もどす
      if(frameMs>26 && fxScale>0.35) fxScale=Math.max(0.35,fxScale-0.06);
      else if(frameMs<19 && fxScale<1) fxScale=Math.min(1,fxScale+0.01);
    }
    drawParts();
    acc+=dt;
    if(acc>90){ acc=0; if(detectOn.checked) detect(); }   // 約11回/秒で判定
  }

  /* ---------- わっかの いち と おおきさ ---------- */
  function placeRing(){
    ring.style.left=(ringPos.x*100)+"%";
    ring.style.top=(ringPos.y*100)+"%";
  }
  function applyRingSize(persist){
    ringVmin=Math.min(60,Math.max(14,ringVmin));
    document.documentElement.style.setProperty("--ring-size", ringVmin+"vmin");
    ringR=ringVmin/200;                 // CSS の 半径（vmin）を 画面比率に そろえる
    ringSizeInput.value=Math.round(ringVmin);
    ringSizeVal.textContent=Math.round(ringVmin);
    prevGray=null; warm=0;              // 見る はんいが かわるので 学習しなおす
    if(persist!==false) save();
  }

  const pointers=new Map();
  let pinchStart=null;                  // {dist, vmin}
  function pinchDist(){
    const p=[...pointers.values()];
    return Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
  }
  ring.addEventListener("pointerdown",e=>{
    ring.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    ring.classList.add("hide-label");
    if(pointers.size===2) pinchStart={dist:pinchDist(), vmin:ringVmin};
  });
  ring.addEventListener("pointermove",e=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size>=2){                       // 2ほんゆびで おおきさ
      if(!pinchStart) pinchStart={dist:pinchDist(), vmin:ringVmin};
      const d=pinchDist();
      if(pinchStart.dist>8){
        ringVmin=pinchStart.vmin*(d/pinchStart.dist);
        applyRingSize();
      }
      return;
    }
    ringPos.x=Math.min(.95,Math.max(.05,e.clientX/window.innerWidth));
    ringPos.y=Math.min(.9,Math.max(.05,e.clientY/window.innerHeight));
    placeRing(); prevGray=null; warm=0; save();
  });
  function endPointer(e){
    pointers.delete(e.pointerId);
    if(pointers.size<2) pinchStart=null;
  }
  ring.addEventListener("pointerup",endPointer);
  ring.addEventListener("pointercancel",endPointer);
  ring.addEventListener("wheel",e=>{            // パソコン用
    e.preventDefault();
    ringVmin += (e.deltaY<0? 2 : -2);
    applyRingSize();
  },{passive:false});
  ring.addEventListener("keydown",e=>{
    const step=.02, map={ArrowLeft:[-step,0],ArrowRight:[step,0],ArrowUp:[0,-step],ArrowDown:[0,step]};
    if(map[e.key]){ ringPos.x+=map[e.key][0]; ringPos.y+=map[e.key][1]; placeRing(); save(); e.preventDefault(); }
    if(e.key==="+"||e.key==="="){ ringVmin+=2; applyRingSize(); e.preventDefault(); }
    if(e.key==="-"||e.key==="_"){ ringVmin-=2; applyRingSize(); e.preventDefault(); }
  });
  ringSizeInput.addEventListener("input",()=>{ ringVmin=+ringSizeInput.value; applyRingSize(); });

  /* ---------- 画面サイズ ---------- */
  function resize(){
    fx.width=window.innerWidth;   // 座標は CSS ピクセルでそろえる
    fx.height=window.innerHeight;
    placeRing(); layoutDeck();
  }
  window.addEventListener("resize",resize);
  window.addEventListener("orientationchange",()=>setTimeout(resize,300));

  /* ---------- 操作 ---------- */
  function manualBite(){
    lastTrigger=performance.now();
    audio();
    onBite();
  }
  $("startBtn").addEventListener("click",()=>{audio();startCamera()});
  $("flipBtn").addEventListener("click",()=>{facing = facing==="user"?"environment":"user"; startCamera()});
  $("gearBtn").addEventListener("click",()=>panel.classList.toggle("open"));
  $("manualBtn").addEventListener("click",manualBite);
  biteBtn.addEventListener("click",()=>{
    biteBtn.classList.remove("tapped"); void biteBtn.offsetWidth; biteBtn.classList.add("tapped");
    manualBite();
  });
  $("resetBtn").addEventListener("click",()=>{
    clearSeq();
    launching=false;
    stage.classList.remove("shake","hard");
    bites=0; counter.textContent="ひとくち 0";
    resetBoard();
    parts=[];
  });
  // ドラッグ中は 数字だけ うごかし、はなした ときに くみ直す
  goalInput.addEventListener("input",()=>{ goalVal.textContent=goalInput.value; });
  goalInput.addEventListener("change",()=>setGoal(+goalInput.value));
  detectOn.addEventListener("change",()=>{ applyDetectMode(); save(); });
  [sndOn,voiceOn].forEach(el=>el.addEventListener("change",save));
  sens.addEventListener("change",save);
  rocketChk.addEventListener("change",()=>{ showRocket(); save(); });
  document.addEventListener("visibilitychange",()=>{ if(document.hidden){ prevGray=null; warm=0; } });

  load();
  buildBoard();
  applyRingSize(false);
  placeRing();
  applyDetectMode();
  updateRocket();
  window.__mogu={onBite,burst,exhaust,completeSequence,
    get bites(){return bites}, get filled(){return filled}, get goal(){return goal},
    get parts(){return parts.length}, get fxScale(){return fxScale}, get frameMs(){return frameMs},
    setRingSize(v){ ringVmin=v; applyRingSize(); },
    setGoal}; // テスト用
})();
</script>
</body>
</html>
